[package]
name = "rust-playout"
version = "0.0.1-alpha"
edition = "2024"
license = "GPL-3.0-or-later"
description = "API-controlled continuous playout using native FFmpeg libraries"

[dependencies]
anyhow = "1"
axum = { version = "0.8", features = ["ws", "multipart"] }
ffmpeg-next = { version = "9", default-features = false, features = ["codec", "format", "software-scaling", "software-resampling"] }
font8x8 = "0.3"
image = { version = "0.25", default-features = false, features = ["png", "jpeg"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["fs", "trace"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4", "serde"] }
url = "2"

[dev-dependencies]
tempfile = "3"

[profile.release]
lto = "thin"
